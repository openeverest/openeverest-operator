                  CredentialsSecretName is the name of the secret with credentials.
                  Optional when WorkloadIdentityConfig is provided.
                type: string
              description:
                description: Description stores description of a backup storage.
                type: string
              endpointURL:
                description: EndpointURL is an endpoint URL of backup storage.
                type: string
              forcePathStyle:
                default: false
                description: |-
                  ForcePathStyle is set to use path-style URLs.
                  If unspecified, the default value is false.
