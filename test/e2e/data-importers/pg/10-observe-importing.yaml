apiVersion: kuttl.dev/v1
kind: TestStep
timeout: 600
commands:
  - timeout: 600
    script: |
      set -euo pipefail

      ns="${NAMESPACE}"
      cluster="test-pg-cluster"

      # Observe transient states and persist a marker once importing is seen.
      for _ in $(seq 1 300); do
        state=$(kubectl get db/${cluster} -n "${ns}" -o jsonpath='{.status.status}' 2>/dev/null || true)
        if [ "${state}" = "importing" ]; then
          kubectl create configmap importing-seen -n "${ns}" --from-literal=seen=true --dry-run=client -o yaml | kubectl apply -f -
          exit 0
        fi
        sleep 2
      done

      echo "DatabaseCluster did not reach 'importing' state"
      exit 1

